server:
  port: 8080

spring:
  application:
    name: issueflow
  datasource:
    url: jdbc:postgresql://localhost:5432/issueflow
    username: issueflow
    password: issueflow
    driverClassName: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

issueflow:
  jwt:
    secret: ${ISSUEFLOW_JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long-for-hs256}
    ttl-seconds: 3600
    issuer: issueflow
  attachments:
    dir: ${ISSUEFLOW_ATTACHMENTS_DIR:./uploads}
    max-size-bytes: 10485760
    allowed-mime-types:
      - image/png
      - image/jpeg
      - application/pdf
      - text/plain
  escalation:
    cron: ${ISSUEFLOW_ESCALATION_CRON:0 0 * * * *}
    run-on-startup: true
  deny-list:
    purge-cron: 0 0 * * * *

logging:
  level:
    org.hibernate.SQL: info
    org.springframework.security: info
